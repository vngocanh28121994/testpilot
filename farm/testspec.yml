version: 0.1

# Pin the managed hosts explicitly. iOS 26+ cannot use the legacy host, and
# both hosts expose the same devicefarm-cli selections used below.
ios_test_host: macos_tahoe
android_test_host: amazon_linux_2

# AWS Device Farm test spec for the Appium Node package produced by
# `npm run farm` (bundle step). Device Farm injects $DEVICEFARM_* variables;
# this spec starts Appium with the matching managed toolchain and capabilities.

phases:
  install:
    commands:
      # Use Device Farm's managed toolchain. The downloaded glibc-compatible
      # Node tarball still failed to execute on the iOS host and silently left
      # the suite on Node 18; `avm` is only available on legacy hosts.
      - devicefarm-cli use node 22
      - node --version
      - devicefarm-cli use appium 2
      - appium --version
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      # Playwright ships in the package because the WebView driver connects over
      # CDP, and connectOverCDP attaches to the browser already running on the
      # phone — it never launches one. Downloading ~130 MB of desktop Chromium
      # here would buy nothing and cost upload minutes on every run.
      - export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      - export PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
      - npm ci --omit=dev || npm install --omit=dev

  pre_test:
    commands:
      # Device Farm provides signed, prebuilt WDA bundles matched by XCUITest
      # driver major. Building stock WDA here fails before the app opens because
      # the AWS host has no customer development team/signing identity.
      - |-
        if [ "$DEVICEFARM_DEVICE_PLATFORM_NAME" = "iOS" ]; then
          APPIUM_DRIVER_VERSION=$(appium driver list --installed --json | jq -r ".xcuitest.version" | cut -d "." -f 1)
          CORRESPONDING_WDA=$(env | grep "DEVICEFARM_APPIUM_WDA_DERIVED_DATA_PATH_V${APPIUM_DRIVER_VERSION}" || true)
          if [ -n "$CORRESPONDING_WDA" ]; then
            DEVICEFARM_APPIUM_WDA_DERIVED_DATA_PATH=$(echo "$CORRESPONDING_WDA" | cut -d "=" -f 2)
          else
            LATEST_WDA=$(env | grep "DEVICEFARM_APPIUM_WDA_DERIVED_DATA_PATH_V" | sort -V -r | head -n 1)
            DEVICEFARM_APPIUM_WDA_DERIVED_DATA_PATH=$(echo "$LATEST_WDA" | cut -d "=" -f 2)
          fi
          if [ -z "$DEVICEFARM_APPIUM_WDA_DERIVED_DATA_PATH" ]; then
            echo "Device Farm không cung cấp prebuilt WDA phù hợp"; exit 1
          fi
          echo "using prebuilt WDA v${APPIUM_DRIVER_VERSION}: $DEVICEFARM_APPIUM_WDA_DERIVED_DATA_PATH"
        fi
      # chromedriver_autodownload is an *insecure feature*: the
      # `appium:chromedriverAutodownload` capability is refused unless the
      # server was started allowing it. Without this flag a hybrid app dies on
      # "No Chromedriver found that can automate Chrome <version>" the moment
      # the driver switches into the WebView — the device's WebView updates far
      # faster than the chromedrivers bundled with the Appium image.
      #
      # Bare feature names, because the install phase pins Appium 2. Appium 3
      # rejects them and demands `*:adb_shell` — it exits before it ever listens
      # — so if that pin moves, this line has to move with it.
      - |-
        if [ "$DEVICEFARM_DEVICE_PLATFORM_NAME" = "iOS" ]; then
          APPIUM_DEFAULT_CAPABILITIES="{\"appium:deviceName\":\"$DEVICEFARM_DEVICE_NAME\",\"platformName\":\"iOS\",\"appium:udid\":\"$DEVICEFARM_DEVICE_UDID\",\"appium:platformVersion\":\"$DEVICEFARM_DEVICE_OS_VERSION\",\"appium:derivedDataPath\":\"$DEVICEFARM_APPIUM_WDA_DERIVED_DATA_PATH\",\"appium:usePrebuiltWDA\":true,\"appium:automationName\":\"XCUITest\"}"
        else
          APPIUM_DEFAULT_CAPABILITIES="{\"appium:deviceName\":\"$DEVICEFARM_DEVICE_NAME\",\"platformName\":\"Android\",\"appium:udid\":\"$DEVICEFARM_DEVICE_UDID\",\"appium:platformVersion\":\"$DEVICEFARM_DEVICE_OS_VERSION\",\"appium:automationName\":\"UiAutomator2\"}"
        fi
        appium --base-path=/wd/hub --log-timestamp --log-no-colors \
          --allow-insecure=chromedriver_autodownload,adb_shell \
          --default-capabilities "$APPIUM_DEFAULT_CAPABILITIES" \
          >> "$DEVICEFARM_LOG_DIR/appium.log" 2>&1 &
      - >
        start_appium_timeout=0;
        while [ true ]; do
          if [ $start_appium_timeout -gt 60 ]; then
            echo "appium did not start within 60 seconds"; exit 1;
          fi;
          grep -i "Appium REST http interface listener started" $DEVICEFARM_LOG_DIR/appium.log >/dev/null 2>&1 && break;
          echo "waiting for appium"; start_appium_timeout=$((start_appium_timeout+1)); sleep 1;
        done

  test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - node --version
      # TESTPILOT_PLATFORM is read by src/cli/run.ts; the device name and
      # Appium endpoint come from the Device Farm environment.
      - export TESTPILOT_PLATFORM=$DEVICEFARM_DEVICE_PLATFORM_NAME
      # Echoed so the log says which phone this job ran on even before the
      # artifacts are pulled, and so a missing variable is visible rather than
      # silently falling back to the placeholder in the config file.
      # No ": " anywhere in this line: an unquoted YAML scalar containing a
      # colon followed by a space is a mapping, not a string. Written that way
      # once, it reached the device as `{echo "device: ...}`, killed the test
      # phase before the runner started, and cost a full run.
      - echo "device=${DEVICEFARM_DEVICE_NAME:-KHONG_CO_BIEN_NAY}"
      # Printed because an empty udid is what sends XCUITest to a Simulator,
      # and the failure that follows names an SDK version instead of a phone.
      - echo "udid=${DEVICEFARM_DEVICE_UDID:-KHONG_CO_BIEN_NAY}"
      - export TESTPILOT_APPIUM_HOST=127.0.0.1
      - export TESTPILOT_APPIUM_PORT=4723
      - export TESTPILOT_APPIUM_PATH=/wd/hub
      - export TESTPILOT_ARTIFACTS=$DEVICEFARM_LOG_DIR
      # Hand the bundled chromedriver to the driver. The zip does not carry the
      # executable bit, so restore it before Appium tries to spawn the binary.
      - >
        if [ -f "$DEVICEFARM_TEST_PACKAGE_PATH/chromedriver/chromedriver" ]; then
          chmod +x "$DEVICEFARM_TEST_PACKAGE_PATH/chromedriver/chromedriver";
          export TESTPILOT_CHROMEDRIVER="$DEVICEFARM_TEST_PACKAGE_PATH/chromedriver/chromedriver";
          echo "using bundled chromedriver: $TESTPILOT_CHROMEDRIVER";
          "$TESTPILOT_CHROMEDRIVER" --version || echo "chromedriver không chạy được trên host này";
        else
          echo "no bundled chromedriver; relying on Appium autodownload";
        fi
      # TESTPILOT_TAG lets one scenario be isolated on the farm. Running the
      # whole suite makes every scenario inherit whatever state the previous
      # one left in the app, which is exactly the thing you need to rule out.
      - >
        node dist/cli/run.js --platform "$TESTPILOT_PLATFORM" --on-farm
        ${TESTPILOT_TAG:+--tag "$TESTPILOT_TAG"}

  post_test:
    commands:
      # The run directory holds the report, its screenshots and its videos
      # together. Without this the verdict, the flake classification and the
      # heal suggestions are computed on the device and then thrown away when
      # the container is destroyed.
      - mkdir -p $DEVICEFARM_LOG_DIR/runs
      - cp -r $DEVICEFARM_TEST_PACKAGE_PATH/runs/* $DEVICEFARM_LOG_DIR/runs/ || true
      # The flake window travels up in the package and was then thrown away
      # with the container: six device runs produced no history at all, so
      # flaky-versus-broken on native could never be decided. It has to come
      # back or the rolling window stays at whatever was last bundled.
      - mkdir -p $DEVICEFARM_LOG_DIR/flake
      - cp $DEVICEFARM_TEST_PACKAGE_PATH/registry/flake.json $DEVICEFARM_LOG_DIR/flake/ || true

artifacts:
  - $DEVICEFARM_LOG_DIR
