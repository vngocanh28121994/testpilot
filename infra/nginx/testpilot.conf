# nginx trước control plane của TestPilot.
#
# File này tồn tại vì một lý do cụ thể: TestPilot stream log lượt chạy qua SSE,
# và cấu hình proxy mặc định của nginx LÀM HỎNG SSE theo cách khó chẩn đoán
# nhất — nó không báo lỗi. Log chỉ đơn giản không hiện, hoặc hiện dồn một cục
# sau vài phút, hoặc đứt giữa lượt chạy. Người dùng báo "tool bị treo", còn
# server thì không có dòng lỗi nào.
#
# Bốn dòng dưới đây là bốn lần ai đó mất một buổi chiều.

upstream testpilot {
    server 127.0.0.1:4300;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name testpilot.example.com;

    ssl_certificate     /etc/nginx/certs/testpilot.crt;
    ssl_certificate_key /etc/nginx/certs/testpilot.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Phiên đăng nhập là cookie `HttpOnly; Secure`, và `Secure` nghĩa là trình
    # duyệt KHÔNG gửi nó qua HTTP. Nên HTTP không phải "kém an toàn hơn" ở đây
    # mà là "không đăng nhập được" — chuyển hướng hết sang HTTPS.
    error_page 497 =301 https://$host$request_uri;

    # Build upload là apk/ipa: 200-400 MB là bình thường. Mặc định của nginx là
    # 1 MB, và nó từ chối bằng 413 — một mã lỗi nói về "quá lớn" mà không nói
    # lớn bao nhiêu là vừa.
    client_max_body_size 512m;

    location / {
        proxy_pass http://testpilot;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Bốn dòng cho SSE ────────────────────────────────────────────────
        #
        # 1. Tắt buffering. Đây là dòng quan trọng nhất trong cả file: nginx
        #    mặc định gom phản hồi vào bộ đệm rồi mới gửi, nên log lượt chạy
        #    chảy theo từng dòng sẽ nằm trong đệm cho tới khi đủ đầy. Người
        #    dùng thấy một màn hình trống trong hai phút rồi 200 dòng cùng lúc.
        proxy_buffering off;
        #
        # 2. Tắt cả bộ đệm request. Không cần cho SSE, nhưng cần cho upload
        #    build: mặc định nginx ghi cả file 400 MB xuống đĩa của chính nó
        #    trước khi chuyển đi.
        proxy_request_buffering off;
        #
        # 3. Không nén. `gzip` trên một stream nghĩa là nén theo khối, và khối
        #    chưa đầy thì chưa gửi — cùng một triệu chứng với buffering, nhưng
        #    ở một tầng khác, nên tắt cái kia rồi vẫn thấy hỏng.
        gzip off;
        #
        # 4. Timeout dài. Một lượt chạy Android dài có thể im lặng vài phút
        #    trong lúc cài app; mặc định 60 giây sẽ cắt đường dây ngay giữa
        #    lượt, và giao diện coi đó là "lượt chạy đã xong".
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Một số proxy trung gian cũng gom đệm. Header này là cách nói với
        # chúng đừng làm thế — vô hại nếu không có ai nghe.
        add_header X-Accel-Buffering no always;
    }

    # Health check: không log, vì nó bị gọi vài lần mỗi giây và sẽ chôn vùi
    # mọi dòng log khác.
    location = /api/health {
        proxy_pass http://testpilot;
        access_log off;
    }
}
